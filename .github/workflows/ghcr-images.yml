name: Publish images to GHCR

# Fork-only: builds the self-host images and pushes them to ghcr.io/<owner>/moneymatter-{fe,be}.
# Kept in its own file so rebasing on upstream never conflicts with upstream workflows.
on:
  push:
    branches: [homelab]
  workflow_dispatch:

concurrency:
  group: ghcr-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fe
            dockerfile: ./self-hosting/frontend/Dockerfile
          - name: be
            dockerfile: ./self-hosting/backend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/moneymatter-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.sha_short }}
          build-args: |
            VITE_APP_COMMIT_HASH=${{ github.sha }}
